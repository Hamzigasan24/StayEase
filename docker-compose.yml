# StayEase local/production-like stack (Step 14).
#
#   docker compose up --build        # foreground
#   docker compose up -d --build     # background
#   docker compose down              # stop (data kept in volumes)
#
# Credentials below are LOCAL DEVELOPMENT placeholders only.
# Production must inject real secrets via environment/shell, never Git.
# Inside the api container the databases live at hostnames
# "postgres" and "mongodb" (NOT localhost).
#
#   SECRET_KEY=$(python3 -c "import secrets; print(secrets.token_urlsafe(48))")
#   POSTGRES_PASSWORD=... SECRET_KEY=$SECRET_KEY docker compose up --build

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stayease}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-production}
      POSTGRES_DB: ${POSTGRES_DB:-stayease_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-stayease}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      APP_NAME: StayEase Hotel Reservation API
      APP_VERSION: 1.0.0
      APP_ENV: ${APP_ENV:-production}
      DEBUG: "false"
      HOST: 0.0.0.0
      PORT: 8000
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-stayease}:${POSTGRES_PASSWORD:-change-me-in-production}@postgres:5432/${POSTGRES_DB:-stayease_db}
      MONGODB_URL: mongodb://mongodb:27017
      MONGODB_DATABASE: ${POSTGRES_DB:-stayease_db}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in the environment}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  mongodata:
